name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Lint API
        working-directory: api
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint and typecheck CMS
        working-directory: cms
        run: npm ci && npm run lint && npx tsc -b --noEmit && npm run check:copy
      - name: Lint and typecheck viewer
        working-directory: viewer
        run: npm ci && npm run lint && npx tsc -b --noEmit && npm run check:copy

      - name: The viewer must not know about admin endpoints
        # Structural, not stylistic. If someone adds an admin call to the
        # viewer, this fails before review does.
        run: |
          if grep -rEn "(/admin/|Authorization)" viewer/src --include='*.ts' --include='*.tsx' \
             | grep -v '^\S*: *\*' | grep -v '//'; then
            echo "Viewer source references an admin endpoint or an auth header."
            exit 1
          fi
          echo "Viewer is clean."

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo
          POSTGRES_DB: peblo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peblo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo
      TEST_DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo_test
      DATA_DIR: ${{ github.workspace }}/data
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: peblo
      MINIO_SECRET_KEY: peblo-dev-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: api
        run: pip install -e ".[dev]"

      # MinIO speaks the same S3 API Cloudflare R2 does, so the R2 storage
      # backend runs for real here rather than only being signature-checked.
      #
      # Started with `docker run` rather than as a service container: the
      # official image needs a `server /data` command and `services:` cannot
      # pass one. It is the same image docker-compose uses, so CI and local
      # development exercise identical code rather than two similar things.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=peblo \
            -e MINIO_ROOT_PASSWORD=peblo-dev-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "MinIO never became ready."
          docker logs minio
          exit 1

      - name: Migrations apply from empty and match the models
        working-directory: api
        # `alembic check` fails if a model changed without a migration, which
        # is the drift that bites on the next deploy rather than in review.
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        working-directory: api
        run: pytest -q

      - name: The R2 backend must have actually run, not skipped
        working-directory: api
        # A storage test that silently skips proves nothing. This asserts the
        # R2 half genuinely executed: no skips, and at least one pass.
        run: |
          set -o pipefail
          output=$(pytest tests/test_storage_contract.py -q -k r2 --no-header -rN | tee /dev/stderr)
          if grep -q "skipped" <<< "$output"; then
            echo "::error::R2 storage tests skipped. MinIO was unreachable, so the"
            echo "::error::storage abstraction was never exercised against a real S3 API."
            exit 1
          fi
          if ! grep -qE "[0-9]+ passed" <<< "$output"; then
            echo "::error::No R2 storage tests ran at all."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          tags: peblo-api:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build CMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cms/Dockerfile
          tags: peblo-cms:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build viewer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: viewer/Dockerfile
          tags: peblo-viewer:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy. Written and explained, but pointed at no real cloud, so it is
  # gated off. Removing the `false &&` and setting the secrets is the whole
  # change needed to make it live.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: false && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      # OIDC, so CI holds no long lived cloud key. The cloud role trusts this
      # repository and branch, and the token lasts minutes rather than forever.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1. Push images to a registry, tagged with the commit SHA rather than
      #    `latest`, so a rollback is "deploy the previous SHA" and not a guess
      #    about what `latest` pointed at an hour ago.
      - name: Push images
        run: echo "docker push registry/peblo-{api,cms,viewer}:${{ github.sha }}"

      # 2. Migrations run before the rollout, as a one-off task against the
      #    production database. They must be backward compatible with the
      #    version still serving traffic, because for the length of the deploy
      #    both schemas are live at once. That is why additive migrations are
      #    the rule and a destructive change is split across two releases.
      - name: Migrate
        run: echo "run alembic upgrade head as a one-off task"

      # 3. Roll the API first, waiting on /readyz rather than /healthz.
      #    /healthz only proves the process is alive; /readyz proves it can
      #    reach the database and storage and that the catalogue pointer
      #    resolves, which is the state the viewer actually depends on.
      - name: Deploy API
        run: echo "deploy api, wait for /readyz, then shift traffic"

      # 4. Frontends last. They are static bundles that call the API, so
      #    shipping them first would briefly point new UI at old endpoints.
      - name: Deploy frontends
        run: echo "sync cms and viewer bundles to the CDN, invalidate cache"

      # 5. Prove the deploy rather than assume it: fetch the catalogue and
      #    check it parses and is non-empty before calling the deploy good.
      - name: Smoke test
        run: echo "curl /readyz and /catalog, assert 200 and a non-empty catalogue"
