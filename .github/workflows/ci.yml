name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Lint API
        working-directory: api
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint and typecheck CMS
        working-directory: cms
        run: npm ci && npm run lint && npx tsc -b --noEmit && npm run check:copy
      - name: Lint and typecheck viewer
        working-directory: viewer
        run: npm ci && npm run lint && npx tsc -b --noEmit && npm run check:copy

      - name: The viewer must not know about admin endpoints
        # Structural, not stylistic. If someone adds an admin call to the
        # viewer, this fails before review does.
        run: |
          if grep -rEn "(/admin/|Authorization)" viewer/src --include='*.ts' --include='*.tsx' \
             | grep -v '^\S*: *\*' | grep -v '//'; then
            echo "Viewer source references an admin endpoint or an auth header."
            exit 1
          fi
          echo "Viewer is clean."

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo
          POSTGRES_DB: peblo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peblo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO speaks the same S3 API Cloudflare R2 does, so the R2 storage
      # backend runs for real here rather than only being signature-checked.
      # As a service container it is always up, so the contract test always
      # executes in CI instead of skipping the way it may do locally.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: peblo
          MINIO_ROOT_PASSWORD: peblo-dev-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo
      TEST_DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo_test
      DATA_DIR: ${{ github.workspace }}/data
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: peblo
      MINIO_SECRET_KEY: peblo-dev-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: api
        run: pip install -e ".[dev]"

      - name: Migrations apply from empty and match the models
        working-directory: api
        # `alembic check` fails if a model changed without a migration, which
        # is the drift that bites on the next deploy rather than in review.
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        working-directory: api
        run: pytest -q

      - name: The R2 backend must have actually run, not skipped
        working-directory: api
        # A storage test that silently skips proves nothing. This fails the
        # build if MinIO was unreachable and the R2 half of the contract was
        # quietly not exercised.
        run: pytest tests/test_storage_contract.py -q -k r2 --no-header -rN | tee /dev/stderr | grep -qv "skipped"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          tags: peblo-api:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build CMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cms/Dockerfile
          tags: peblo-cms:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build viewer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: viewer/Dockerfile
          tags: peblo-viewer:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy. Written and explained, but pointed at no real cloud, so it is
  # gated off. Removing the `false &&` and setting the secrets is the whole
  # change needed to make it live.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: false && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      # OIDC, so CI holds no long lived cloud key. The cloud role trusts this
      # repository and branch, and the token lasts minutes rather than forever.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1. Push images to a registry, tagged with the commit SHA rather than
      #    `latest`, so a rollback is "deploy the previous SHA" and not a guess
      #    about what `latest` pointed at an hour ago.
      - name: Push images
        run: echo "docker push registry/peblo-{api,cms,viewer}:${{ github.sha }}"

      # 2. Run migrations as a one-off task BEFORE the new API rolls out.
      #    Migrations must be backward compatible with the currently running
      #    version, because for a few seconds both versions are live. That
      #    rules out dropping a column in the same deploy that stops using it:
      #    it takes two deploys, one to stop reading it and one to drop it.
      - name: Migrate
        run: echo "run-task peblo-api:${{ github.sha }} -- alembic upgrade head"

      # 3. Roll out the API, waiting on /readyz rather than /healthz. Readiness
      #    proves the pointer resolves to a readable catalogue, so a container
      #    that cannot serve the viewer never takes traffic.
      - name: Deploy API
        run: echo "deploy peblo-api:${{ github.sha }} --health-check /readyz"

      # 4. Frontends last, because they are static bundles that call an API
      #    which must already speak the new shape. Deploying them first would
      #    put a UI in front of users that the backend cannot yet answer.
      - name: Deploy frontends
        run: echo "deploy peblo-cms and peblo-viewer :${{ github.sha }}"

      # 5. Smoke test the thing users actually touch. If the published
      #    catalogue does not load, the deploy is rolled back rather than left
      #    for someone to notice.
      - name: Smoke test
        run: echo "curl -f https://api.peblo.example/readyz && curl -f https://api.peblo.example/catalog"
