services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
      POSTGRES_DB: peblo
    # Host port is configurable so a machine that already runs Postgres on
    # 5432 does not have to stop it to try this project.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql+psycopg://peblo:peblo@db:5432/peblo
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-not-for-production-use}
      SEED_EDITOR_EMAIL: ${SEED_EDITOR_EMAIL:-editor@peblo.test}
      SEED_EDITOR_PASSWORD: ${SEED_EDITOR_PASSWORD:-editor-dev-password}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@peblo.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-dev-password}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/storage_local
      STORAGE_PUBLIC_BASE_URL: http://localhost:${API_HOST_PORT:-8000}/media
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:${CMS_HOST_PORT:-5173},http://localhost:${VIEWER_HOST_PORT:-5174}
    # Host port is configurable so a machine already running something on
    # 8000 does not have to stop it to try this project.
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - artwork:/app/storage_local

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CMS_HOST_PORT:-5173}:80"

  viewer:
    build:
      context: .
      dockerfile: viewer/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${VIEWER_HOST_PORT:-5174}:80"

  # Not started by `docker compose up`. It exists so the R2 storage backend
  # can be exercised against a real S3 API rather than only being written.
  # Start it with:  docker compose --profile storage-test up -d minio
  minio:
    image: minio/minio:latest
    profiles: [storage-test]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: peblo
      MINIO_ROOT_PASSWORD: peblo-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  artwork:
